<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeartSafe AI 💓</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      overflow-x: hidden;
    }

    .hero {
      text-align: center;
      padding: 50px 20px;
      color: #b30000;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: bold;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.2);
    }

    .hero p {
      font-size: 1.2rem;
      font-style: italic;
      margin-top: 10px;
    }

    .form-container {
      background: #fff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      max-width: 600px;
      margin: 30px auto;
      position: relative;
      z-index: 1;
    }

    .btn-predict {
      background: #ff4d6d;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .btn-predict:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    /* Floating hearts animation */
    .heart-float {
      position: absolute;
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      opacity: 0.8;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(0deg); opacity:0.5; }
      50% { opacity: 1; }
      100% { transform: translateY(-20vh) rotate(360deg); opacity:0; }
    }

    .heart-red { color: #ff4d6d; }
    .heart-pink { color: #ff85a2; }
    .heart-light { color: #ffc0cb; }
  </style>
</head>
<body>

  <!-- Floating Hearts -->
  <div id="hearts-container"></div>

  <div class="hero">
    <h1>HeartSafe AI 💓</h1>
    <p>“Predict. Prevent. Protect your heart life!”</p>
  </div>

  <div class="form-container">
    <h3 class="text-center mb-4">Enter Your Details</h3>
    <form action="/predict" method="POST">
      
      <div class="mb-3">
        <label class="form-label">Name (Optional)</label>
        <input type="text" class="form-control" name="Name" placeholder="Your Name">
      </div>

      <div class="mb-3">
        <label class="form-label">Email (Optional)</label>
        <input type="email" class="form-control" name="Email" placeholder="Your Email">
      </div>

      <div class="mb-3">
        <label class="form-label">Age</label>
        <input type="number" class="form-control" name="age" placeholder="Enter your age" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Sex (1 = Male, 0 = Female)</label>
        <input type="number" class="form-control" name="sex" placeholder="Enter 1 for Male or 0 for Female" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Chest Pain (Yes or No)</label>
        <input type="text" class="form-control" name="cp" placeholder="Type Yes or No" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Resting Blood Pressure (mm Hg)</label>
        <input type="number" class="form-control" name="trestbps" placeholder="e.g., 120" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Cholesterol (mg/dl)</label>
        <input type="number" class="form-control" name="chol" placeholder="e.g., 200" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Fasting Blood Sugar >120 mg/dl (1=yes, 0=no)</label>
        <input type="number" class="form-control" name="fbs" placeholder="Enter 1 or 0" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Max Heart Rate Achieved</label>
        <input type="number" class="form-control" name="thalach" placeholder="e.g., 150" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Exercise Induced Angina (1=yes, 0=no)</label>
        <input type="number" class="form-control" name="exang" placeholder="Enter 1 or 0" required>
      </div>

      <button type="submit" class="btn btn-predict w-100 mt-3">Predict ❤️</button>
    </form>
  </div>

  <!-- Floating Hearts Script -->
  <script>
    const colors = ['heart-red','heart-pink','heart-light'];
    for(let i=0;i<20;i++){
      const heart = document.createElement('div');
      heart.classList.add('heart-float');
      heart.classList.add(colors[Math.floor(Math.random()*colors.length)]);
      heart.style.left = Math.random()*100+'vw';
      heart.style.fontSize = (Math.random()*20 + 20)+'px';
      heart.textContent = '❤️';
      heart.style.animationDuration = (Math.random()*5 + 5)+'s';
      document.getElementById('hearts-container').appendChild(heart);
    }
  </script>

</body>
</html>
